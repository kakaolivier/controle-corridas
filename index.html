<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Diário de Corridas</title>
    
    <!-- Meta tags para PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes"> 
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Corridas App">
    <meta name="theme-color" content="#4f46e5"> 

    <!-- Carrega as dependências necessárias -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase UMD Imports - Necessários para o funcionamento real do Firestore -->
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
    
    <style>
        .whitespace-pre-line {
            white-space: pre-line;
        }
    </style>
</head>
<body class="bg-gray-50 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;
        
        // --- 1. CONFIGURAÇÃO DE ÍCONES ROBUSTA (SVG Inline) ---
        // A forma mais confiável de usar ícones em React/Babel de arquivo único.
        const SVGIcon = ({ children, className = 'w-5 h-5', color = 'text-gray-500', size = 24 }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round"
                className={className + ' ' + color}
            >
                {children}
            </svg>
        );

        const Clock = (props) => (
            <SVGIcon {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></SVGIcon>
        );
        const DollarSign = (props) => (
            <SVGIcon {...props}><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></SVGIcon>
        );
        const BarChart2 = (props) => (
            <SVGIcon {...props}><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></SVGIcon>
        );
        const TrendingUp = (props) => (
            <SVGIcon {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></SVGIcon>
        );
        const TrendingDown = (props) => (
            <SVGIcon {...props}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></SVGIcon>
        );
        const RefreshCw = (props) => (
             <SVGIcon {...props}><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.5 15a9 9 0 0 1 14.8-1.4L23 10"></path><path d="M1 14l4.7 4.7A9 9 0 0 0 20.5 9"></path></SVGIcon>
        );
        const Loader2 = (props) => (
             <SVGIcon {...props}><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></SVGIcon>
        );
        const User = (props) => (
             <SVGIcon {...props}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></SVGIcon>
        );
        const Gauge = (props) => (
             <SVGIcon {...props}><path d="M12 19.5L5.5 12h13L12 19.5z"></path><path d="M12 4v8"></path><path d="M16.2 8.7L19.5 12"></path><path d="M7.8 8.7L4.5 12"></path></SVGIcon>
        );
        const Fuel = (props) => (
             <SVGIcon {...props}><path d="M3 22h18"></path><path d="M4 22V10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12"></path><path d="M18 6l-2-4"></path><path d="M8 12h8"></path></SVGIcon>
        );
        const Car = (props) => (
             <SVGIcon {...props}><path d="M19 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"></path><circle cx="7" cy="15" r="2"></circle><circle cx="17" cy="15" r="2"></circle><path d="M14 5H9"></path></SVGIcon>
        );
        const Coffee = (props) => (
             <SVGIcon {...props}><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M10 21V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v16h16a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H8"></path><path d="M16 8h1"></path></SVGIcon>
        );
        const Sparkles = (props) => (
             <SVGIcon {...props}><path d="M14.5 4.5l2.4 3-2.4 3"></path><path d="M18 2h4v4"></path><path d="M14.5 20.5l-2.4-3 2.4-3"></path><path d="M18 22h4v-4"></path><path d="M8.5 4.5l-2.4-3 2.4-3"></path><path d="M2 2h4v4"></path><path d="M8.5 20.5l-2.4 3 2.4 3"></path><path d="M2 22h4v-4"></path></SVGIcon>
        );

        // --- 2. CONFIGURAÇÃO FIREBASE REAL (MANDATÓRIO) ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'daily_runs_tracker';

        // Constantes para acesso seguro às funções globais
        const fbApp = window.firebase.initializeApp;
        const fbAuth = {
            getAuth: window.firebase.auth.getAuth,
            signInAnonymously: window.firebase.auth.signInAnonymously,
            signInWithCustomToken: window.firebase.auth.signInWithCustomToken,
            onAuthStateChanged: window.firebase.auth.onAuthStateChanged,
        };
        const fbFirestore = {
            getFirestore: window.firebase.firestore.getFirestore,
            doc: window.firebase.firestore.doc,
            setDoc: window.firebase.firestore.setDoc,
            deleteDoc: window.firebase.firestore.deleteDoc,
            onSnapshot: window.firebase.firestore.onSnapshot,
            collection: window.firebase.firestore.collection,
            query: window.firebase.firestore.query,
        };
        
        // Atribuições para compatibilidade com o código anterior
        const initializeApp = fbApp;
        const { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } = fbAuth;
        const { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } = fbFirestore;
        
        // Configuração Gemini API
        const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent";
        const API_KEY = ""; // Será preenchida pelo ambiente de execução

        // Funções utilitárias
        const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
        const formatNumber = (value) => parseFloat(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const safeDiv = (numerator, denominator) => (denominator > 0 ? numerator / denominator : 0);

        const initialInputs = {
            date: new Date().toISOString().substring(0, 10),
            saldo: '', // Total Ganho Bruto
            aluguel: '', // Despesas Fixas (Aluguel/Financiamento)
            gasolina: '', // Despesas Variáveis (Combustível)
            refeicao: '', // Despesas Variáveis (Alimentação)
            outros: '', // Outras Despesas
            corridas: '', // Número de Corridas
            horas: '', // Horas Online
            km: '', // Quilometragem Total
        };

        const StatCard = ({ title, value, unit, icon: Icon, color }) => (
            <div className="bg-white p-4 shadow-lg rounded-xl flex flex-col justify-between transition-all duration-300 hover:shadow-xl border border-gray-100">
                <div className="flex items-center justify-between">
                    <h3 className="text-sm font-semibold text-gray-500 truncate">{title}</h3>
                    {Icon && <Icon className={`w-5 h-5 ${color} opacity-80`} />} 
                </div>
                <p className="mt-1 text-2xl font-bold text-gray-900">
                    {formatNumber(value)}
                    {unit && <span className="text-base font-medium text-gray-500 ml-1">{unit}</span>}
                </p>
            </div>
        );

        const App = () => {
            const [inputs, setInputs] = useState(initialInputs);
            const [records, setRecords] = useState([]); 
            const [loading, setLoading] = useState(true); 
            const [saving, setSaving] = useState(false);
            const [error, setError] = useState(null);
            
            const [isEditing, setIsEditing] = useState(false);
            const [currentRecordId, setCurrentRecordId] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);

            const [analysisOutput, setAnalysisOutput] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [analysisForMonth, setAnalysisForMonth] = useState(null); 

            const [db, setDb] = useState(null);
            const [auth, setAuth] = useState(null);
            const [userId, setUserId] = useState(null);

            // --- 3. Inicialização e Autenticação Firebase ---
            useEffect(() => {
                if (Object.keys(firebaseConfig).length === 0) {
                    console.error("Firebase Config não encontrado. Usando ID de usuário de mock.");
                    setUserId(crypto.randomUUID());
                    setLoading(false);
                    return;
                }

                try {
                    const app = initializeApp(firebaseConfig);
                    const firestore = getFirestore(app);
                    const firebaseAuth = getAuth(app);
                    
                    setDb(firestore);
                    setAuth(firebaseAuth);

                    const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                    const authSetup = async () => {
                        try {
                            if (token) {
                                await signInWithCustomToken(firebaseAuth, token);
                            } else {
                                await signInAnonymously(firebaseAuth);
                            }
                        } catch (e) {
                            console.error("Erro na autenticação:", e);
                            setUserId(crypto.randomUUID()); // Fallback
                        }
                    };
                    
                    const unsubscribe = onAuthStateChanged(firebaseAuth, (user) => {
                        if (user) {
                            setUserId(user.uid);
                        }
                        setLoading(false); 
                    });
                    
                    authSetup(); // Inicia o processo de autenticação
                    return () => unsubscribe();
                } catch (e) {
                    console.error("Erro fatal ao inicializar Firebase:", e);
                    setError("Erro ao conectar com o banco de dados. (Verifique UMD/Config)");
                    setUserId(crypto.randomUUID()); 
                    setLoading(false);
                }
            }, []);

            // --- 4. Busca de Dados em Tempo Real (onSnapshot) ---
            useEffect(() => {
                if (!db || !userId) return;

                const collectionPath = `artifacts/${appId}/users/${userId}/daily_runs`;
                const q = collection(db, collectionPath);
                
                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const fetchedRecords = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    })).sort((a, b) => new Date(b.date) - new Date(a.date)); // Ordena por data (mais recente primeiro)
                    
                    setRecords(fetchedRecords);
                    setLoading(false);
                }, (err) => {
                    console.error("Erro ao carregar registros:", err);
                    setError("Falha ao sincronizar dados em tempo real.");
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [db, userId]); 

            const handleChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({ ...prev, [name]: value }));
            };

            const stats = useMemo(() => {
                const saldo = parseFloat(inputs.saldo) || 0;
                const aluguel = parseFloat(inputs.aluguel) || 0;
                const gasolina = parseFloat(inputs.gasolina) || 0;
                const refeicao = parseFloat(inputs.refeicao) || 0;
                const outros = parseFloat(inputs.outros) || 0;
                const despesas = aluguel + gasolina + refeicao + outros;

                const corridas = parseInt(inputs.corridas) || 0;
                const horas = parseFloat(inputs.horas) || 0;
                const km = parseFloat(inputs.km) || 0;

                const dailyProfit = saldo - despesas;

                return {
                    dailyProfit, 
                    despesas, 
                    // Métricas de Renda Bruta
                    grossPerTrip: safeDiv(saldo, corridas),
                    grossPerHour: safeDiv(saldo, horas),
                    grossPerKm: safeDiv(saldo, km),
                    // Métricas de Custo
                    costPerTrip: safeDiv(despesas, corridas),
                    costPerHour: safeDiv(despesas, horas),
                    costPerKm: safeDiv(despesas, km),
                    // Métricas de Lucro Líquido
                    profitPerTrip: safeDiv(dailyProfit, corridas),
                    profitPerHour: safeDiv(dailyProfit, horas),
                    profitPerKm: safeDiv(dailyProfit, km),
                    
                    aluguel, gasolina, refeicao, outros, // Inclui as despesas individuais
                };
            }, [inputs]);

            const saveRecord = useCallback(async () => {
                if (!db || !userId || saving) return;

                const { date, saldo, corridas, horas, km } = inputs;
                
                if (!date || !saldo || !corridas || !horas || !km) {
                    setError("Por favor, preencha a Data, Saldo, Nº Corridas, Horas e KM.");
                    return;
                }

                setSaving(true);
                setError(null);

                const despesasTotal = stats.despesas;

                const recordData = {
                    date,
                    saldo: parseFloat(saldo),
                    despesas: despesasTotal, 
                    corridas: parseInt(corridas),
                    horas: parseFloat(horas),
                    km: parseFloat(km),
                    ...stats, 
                    createdAt: new Date().toISOString(),
                    userId,
                };

                try {
                    // Usa a data como ID do documento para garantir unicidade e facilidade de busca
                    const docId = date; 
                    const docRef = doc(db, `artifacts/${appId}/users/${userId}/daily_runs`, docId);
                    await setDoc(docRef, recordData);
                    
                    setInputs(initialInputs);
                    setCurrentRecordId(null);
                    setIsEditing(false);
                    setAnalysisOutput(null);

                } catch (e) {
                    console.error("Erro ao salvar:", e);
                    setError("Erro ao salvar o registro. Verifique o console para mais detalhes.");
                } finally {
                    setSaving(false);
                }
            }, [inputs, stats, db, userId, saving]);

            const handleDelete = useCallback(async (recordId) => {
                if (!db || !userId) return;
                
                setDeleteConfirmId(null); 
                setError(null);

                try {
                    const docRef = doc(db, `artifacts/${appId}/users/${userId}/daily_runs`, recordId);
                    await deleteDoc(docRef);
                    setAnalysisOutput(null); 
                } catch (e) {
                    console.error("Erro ao deletar:", e);
                    setError("Erro ao excluir o registro. Tente novamente.");
                }
            }, [db, userId]); 

            const handleEdit = useCallback((record) => {
                setInputs({
                    date: record.date,
                    saldo: String(record.saldo || ''), 
                    aluguel: String(record.aluguel || ''),
                    gasolina: String(record.gasolina || ''),
                    refeicao: String(record.refeicao || ''),
                    outros: String(record.outros || ''),
                    corridas: String(record.corridas || ''),
                    horas: String(record.horas || ''),
                    km: String(record.km || ''),
                });
                setCurrentRecordId(record.id);
                setIsEditing(true);
                setError(null);
                setAnalysisOutput(null); 
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, []);

            const monthlySummary = useMemo(() => {
                if (records.length === 0) return [];
                
                const summary = records.reduce((acc, record) => {
                    const monthYear = record.date.substring(0, 7); 
                    
                    if (!acc[monthYear]) {
                        acc[monthYear] = {
                            monthYear,
                            totalProfit: 0, totalKm: 0, totalTrips: 0, totalHours: 0, totalDespesas: 0,
                            aluguel: 0, gasolina: 0, refeicao: 0, outros: 0, 
                            count: 0,
                        };
                    }
                    
                    acc[monthYear].totalProfit += parseFloat(record.dailyProfit) || 0;
                    acc[monthYear].totalKm += parseFloat(record.km) || 0;
                    acc[monthYear].totalTrips += parseInt(record.corridas) || 0;
                    acc[monthYear].totalHours += parseFloat(record.horas) || 0;
                    acc[monthYear].totalDespesas += parseFloat(record.despesas) || 0;
                    
                    acc[monthYear].aluguel += parseFloat(record.aluguel) || 0;
                    acc[monthYear].gasolina += parseFloat(record.gasolina) || 0;
                    acc[monthYear].refeicao += parseFloat(record.refeicao) || 0;
                    acc[monthYear].outros += parseFloat(record.outros) || 0;

                    acc[monthYear].count += 1;
                    
                    return acc;
                }, {});

                return Object.values(summary).map(monthData => ({
                    ...monthData,
                    profitPerKm: safeDiv(monthData.totalProfit, monthData.totalKm),
                    profitPerHour: safeDiv(monthData.totalProfit, monthData.totalHours),
                    costPerTrip: safeDiv(monthData.totalDespesas, monthData.totalTrips),
                    avgAluguel: safeDiv(monthData.aluguel, monthData.count),
                    avgGasolina: safeDiv(monthData.gasolina, monthData.count),
                    avgRefeicao: safeDiv(monthData.refeicao, monthData.count),
                    avgOutros: safeDiv(monthData.outros, monthData.count),
                })).sort((a, b) => b.monthYear.localeCompare(a.monthYear)); 
            }, [records]);

            const handleAnalyzeCosts = useCallback(async (monthData) => {
                setIsAnalyzing(true);
                setAnalysisOutput(null);
                setAnalysisForMonth(monthData.monthYear);
                setError(null);

                const systemPrompt = "Você é um consultor financeiro especialista em otimização de custos para motoristas de aplicativo. Forneça uma análise concisa (3 a 4 parágrafos) focada em identificar áreas de alto custo e ofereça 3 dicas práticas e acionáveis para otimizar os lucros sem comprometer o desempenho. Mantenha um tom profissional e direto.";

                const userQuery = `Analise meus dados financeiros agregados para o mês de ${monthData.monthYear}, com foco em custos.

Dados do Mês:
- Lucro Total: R$${formatNumber(monthData.totalProfit)}
- Despesas Totais: R$${formatNumber(monthData.totalDespesas)}
- Quilometragem Total: ${formatNumber(monthData.totalKm)} km
- Viagens Totais: ${monthData.totalTrips} viagens
- Horas Trabalhadas: ${formatNumber(monthData.totalHours)} horas

Custos Médios Diários Detalhados (Baseado em ${monthData.count} dias de registro):
- Custo Médio Diário Aluguel/Financ. (Fixos): R$${formatNumber(monthData.avgAluguel)}
- Custo Médio Diário Gasolina/Combustível (Variáveis): R$${formatNumber(monthData.avgGasolina)}
- Custo Médio Diário Refeição: R$${formatNumber(monthData.avgRefeicao)}
- Custo Médio Diário Outros: R$${formatNumber(monthData.avgOutros)}
`;

                const payload = {
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                };

                const maxRetries = 3;

                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        const response = await fetch(`${GEMINI_API_URL}?key=${API_KEY}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            const result = await response.json();
                            const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (text) {
                                setAnalysisOutput(text);
                                setIsAnalyzing(false);
                                return; 
                            }
                        }
                        
                        if (attempt < maxRetries - 1) {
                            await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                        } else {
                            throw new Error("Falha na geração após múltiplas tentativas.");
                        }
                    } catch (e) {
                        if (attempt === maxRetries - 1) {
                            setError(`Erro ao gerar análise. Ocorreu um problema de rede ou no servidor.`);
                        }
                    }
                }
                
                setIsAnalyzing(false);
            }, []);

            const MonthlyDashboard = ({ summary }) => {
                if (!summary || summary.length === 0) return null;

                const getMonthName = (monthYear) => {
                    const date = new Date(`${monthYear}-01T12:00:00Z`);
                    return date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                }

                return (
                    <div className="mt-8 bg-indigo-50 p-6 rounded-xl shadow-inner mb-8">
                        <h2 className="text-2xl font-bold mb-4 text-indigo-700 flex items-center">
                            <BarChart2 className="w-5 h-5 mr-2 text-indigo-700" /> Resumo Mensal
                        </h2>
                        <div className="space-y-6">
                            {summary.map((month) => {
                                const monthName = getMonthName(month.monthYear);
                                const isCurrentAnalysis = analysisForMonth === month.monthYear;
                                
                                return (
                                    <div key={month.monthYear} className="p-4 bg-white rounded-lg shadow-md border-l-4 border-indigo-500">
                                        <h3 className="text-xl font-extrabold text-indigo-600 mb-2 capitalize">{monthName}</h3>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                                            <div className="p-2 bg-green-50 rounded-md">
                                                <p className="text-xs text-gray-500">Lucro Total</p>
                                                <p className="font-bold text-green-700">{formatCurrency(month.totalProfit)}</p>
                                            </div>
                                            <div className="p-2 bg-red-50 rounded-md">
                                                <p className="text-xs text-gray-500">Custo Total</p>
                                                <p className="font-bold text-red-700">{formatCurrency(month.totalDespesas)}</p>
                                            </div>
                                            <div className="p-2 bg-yellow-50 rounded-md">
                                                <p className="text-xs text-gray-500">KM Total</p>
                                                <p className="font-bold text-yellow-700">{formatNumber(month.totalKm)} km</p>
                                            </div>
                                            <div className="p-2 bg-blue-50 rounded-md">
                                                <p className="text-xs text-gray-500">Viagens Total</p>
                                                <p className="font-bold text-blue-700">{month.totalTrips}</p>
                                            </div>
                                        </div>
                                        <div className="mt-3 pt-3 border-t border-gray-100 grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
                                            <p className="text-gray-600">Lucro Líq./KM: <span className="font-bold text-teal-700">{formatCurrency(month.profitPerKm)}</span></p>
                                            <p className="text-gray-600">Lucro Líq./Hora: <span className="font-bold text-teal-700">{formatCurrency(month.profitPerHour)}</span></p>
                                            <p className="text-gray-600">Custo Médio/Viagem: <span className="font-bold text-red-700">{formatCurrency(month.costPerTrip)}</span></p>
                                        </div>
                                        
                                        <div className="mt-4 flex justify-end">
                                            <button
                                                onClick={() => handleAnalyzeCosts(month)}
                                                disabled={isAnalyzing}
                                                className={`flex items-center justify-center px-4 py-2 font-semibold text-white rounded-lg shadow-md transition duration-150 text-sm ${
                                                    isAnalyzing && isCurrentAnalysis
                                                        ? 'bg-purple-400 cursor-wait'
                                                        : 'bg-purple-600 hover:bg-purple-700 active:bg-purple-800'
                                                }`}
                                            >
                                                {isAnalyzing && isCurrentAnalysis ? (
                                                    <>
                                                        <Loader2 className="w-4 h-4 mr-2 animate-spin" /> Analisando...
                                                    </>
                                                ) : (
                                                    <>
                                                        <Sparkles className="w-4 h-4 mr-2" /> Análise de Custos ✨
                                                    </>
                                                )}
                                            </button>
                                        </div>

                                        {isCurrentAnalysis && analysisOutput && (
                                            <div className="mt-4 p-4 bg-purple-50 border border-purple-300 rounded-lg whitespace-pre-line text-sm text-gray-800">
                                                <p className="font-bold text-purple-700 mb-2">Relatório do Consultor Gemini para {monthName}:</p>
                                                {analysisOutput}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            const HistoricalRecords = ({ records, handleEdit, handleDelete, isEditing, deleteConfirmId, setDeleteConfirmId }) => (
                <div className="mt-8 bg-white p-6 rounded-xl shadow-lg">
                    <h2 className="text-2xl font-bold mb-4 text-gray-700 flex items-center">
                        <Clock className="w-5 h-5 mr-2 text-gray-600" /> Histórico Diário ({records.length})
                    </h2>
                    <div className="space-y-3 max-h-96 overflow-y-auto pr-2">
                        {records.map((r) => (
                            <div key={r.id} className="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                <p className="font-bold text-lg text-indigo-600 mb-2">
                                    {new Date(r.date).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' })}
                                    {r.id === currentRecordId && <span className="text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 ml-2 rounded-full font-medium">EDITANDO</span>}
                                </p>
                                <div className="grid grid-cols-2 text-sm mt-1 gap-1">
                                    <span className="text-gray-600">Lucro Líquido:</span>
                                    <span className={`font-semibold ${r.dailyProfit >= 0 ? 'text-green-700' : 'text-red-700'}`}>{formatCurrency(r.dailyProfit)}</span>
                                    <span className="text-gray-600">Lucro/Hora:</span>
                                    <span className="font-semibold text-teal-700">{formatCurrency(r.profitPerHour)}</span>
                                    <span className="text-gray-600">KM / Corridas:</span>
                                    <span className="font-semibold text-gray-800">{r.km} km / {r.corridas} viagens</span>
                                </div>
                                
                                {deleteConfirmId === r.id ? (
                                    <div className="mt-3 p-2 bg-red-100 rounded-md flex justify-between items-center">
                                        <span className="text-sm text-red-800 font-semibold">Confirmar exclusão?</span>
                                        <div>
                                            <button 
                                                onClick={() => handleDelete(r.id)} 
                                                className="text-white bg-red-600 hover:bg-red-700 text-xs py-1 px-2 rounded-lg mr-2 transition"
                                            >
                                                Sim, Excluir
                                            </button>
                                            <button 
                                                onClick={() => setDeleteConfirmId(null)} 
                                                className="text-red-600 bg-white hover:bg-gray-200 text-xs py-1 px-2 rounded-lg transition border border-gray-300"
                                            >
                                                Cancelar
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="mt-3 flex space-x-2 border-t pt-2 border-gray-200">
                                        <button 
                                            onClick={() => handleEdit(r)} 
                                            disabled={isEditing}
                                            className={`text-indigo-600 hover:text-indigo-800 bg-indigo-100 text-xs py-1 px-3 rounded-full font-medium transition ${isEditing ? 'opacity-50 cursor-not-allowed' : ''}`}
                                        >
                                            Editar
                                        </button>
                                        <button 
                                            onClick={() => setDeleteConfirmId(r.id)} 
                                            disabled={isEditing}
                                            className={`text-red-600 hover:text-red-800 bg-red-100 text-xs py-1 px-3 rounded-full font-medium transition ${isEditing ? 'opacity-50 cursor-not-allowed' : ''}`}
                                        >
                                            Excluir
                                        </button>
                                    </div>
                                )}
                            </div>
                        ))}
                        {records.length === 0 && !loading && <p className="text-center text-gray-500 py-4">Nenhum registro encontrado. Salve seu primeiro dia!</p>}
                        {loading && <p className="text-center text-indigo-500 py-4 flex justify-center items-center"><Loader2 className="w-5 h-5 mr-2 animate-spin"/> Carregando histórico...</p>}
                    </div>
                </div>
            );

            const Input = ({ label, name, value, onChange, type, placeholder, disabled, icon: Icon, required = false }) => (
                <div className="relative">
                    <label htmlFor={name} className="block text-sm font-medium text-gray-700">
                        {label} {required && <span className="text-red-500">*</span>}
                    </label>
                    <div className="relative">
                        {Icon && <Icon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-gray-400"/>}
                        <input
                            id={name}
                            name={name}
                            type={type}
                            value={value}
                            onChange={onChange}
                            step={type === 'number' ? '0.01' : '1'}
                            placeholder={placeholder}
                            disabled={disabled}
                            required={required}
                            className={`mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 ${disabled ? 'bg-gray-100' : 'bg-white'} ${Icon ? 'pl-9' : 'pl-3'}`}
                        />
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-gray-50 p-4 sm:p-8 font-sans">
                    <div className="max-w-4xl mx-auto">
                        <header className="text-center mb-8">
                            <h1 className="text-4xl font-extrabold text-indigo-700 tracking-tight">
                                Controle Diário de Corridas
                            </h1>
                            <p className="text-gray-500 mt-2">
                                Insira os dados do dia para calcular o Lucro e Estatísticas.
                            </p>
                        </header>

                        {error && (
                            <div className="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm font-medium" role="alert">
                                <strong>Erro:</strong> {error}
                            </div>
                        )}
                        
                        <div className="bg-white p-6 rounded-xl shadow-2xl mb-8">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">
                                {isEditing ? `Editando Registro de ${new Date(inputs.date).toLocaleDateString('pt-BR')}` : 'Novo Registro Diário'}
                            </h2>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                <div className="col-span-2 md:col-span-1">
                                    <Input 
                                        label="Data" 
                                        name="date" 
                                        type="date" 
                                        value={inputs.date} 
                                        onChange={handleChange} 
                                        required
                                    />
                                </div>
                                <div className="col-span-2 md:col-span-1">
                                    <Input 
                                        label="Saldo Bruto (R$)" 
                                        name="saldo" 
                                        type="number" 
                                        value={inputs.saldo} 
                                        onChange={handleChange} 
                                        icon={DollarSign} 
                                        placeholder="Ex: 550.00" 
                                        required
                                    />
                                </div>
                                <Input 
                                    label="Nº Corridas" 
                                    name="corridas" 
                                    type="number" 
                                    value={inputs.corridas} 
                                    onChange={handleChange} 
                                    icon={Car} 
                                    placeholder="Ex: 35" 
                                    required
                                />
                                <Input 
                                    label="Horas Online" 
                                    name="horas" 
                                    type="number" 
                                    value={inputs.horas} 
                                    onChange={handleChange} 
                                    icon={Clock} 
                                    placeholder="Ex: 10.5" 
                                    required
                                />
                                <div className="col-span-2 md:col-span-4">
                                    <Input 
                                        label="KM Total Rodado" 
                                        name="km" 
                                        type="number" 
                                        value={inputs.km} 
                                        onChange={handleChange} 
                                        icon={Gauge} 
                                        placeholder="Ex: 280.4" 
                                        required
                                    />
                                </div>
                            </div>

                            <h3 className="text-md font-semibold text-gray-700 border-t pt-4 mt-4 mb-3">Despesas (R$)</h3>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <Input 
                                    label="Aluguel/Financ." 
                                    name="aluguel" 
                                    type="number" 
                                    value={inputs.aluguel} 
                                    onChange={handleChange} 
                                    icon={Car} 
                                    placeholder="0.00" 
                                />
                                <Input 
                                    label="Gasolina/Etanol" 
                                    name="gasolina" 
                                    type="number" 
                                    value={inputs.gasolina} 
                                    onChange={handleChange} 
                                    icon={Fuel} 
                                    placeholder="0.00" 
                                />
                                <Input 
                                    label="Refeição" 
                                    name="refeicao" 
                                    type="number" 
                                    value={inputs.refeicao} 
                                    onChange={handleChange} 
                                    icon={Coffee} 
                                    placeholder="0.00" 
                                />
                                <Input 
                                    label="Outros (Limpeza, etc)" 
                                    name="outros" 
                                    type="number" 
                                    value={inputs.outros} 
                                    onChange={handleChange} 
                                    icon={DollarSign} 
                                    placeholder="0.00" 
                                />
                            </div>

                            <div className="mt-6 flex justify-end space-x-3">
                                <button
                                    onClick={saveRecord}
                                    disabled={saving || loading || !userId || !inputs.date || !inputs.saldo || !inputs.corridas || !inputs.horas || !inputs.km}
                                    className={`flex items-center justify-center px-6 py-3 font-bold text-white rounded-xl shadow-lg transition duration-150 ${
                                        saving 
                                            ? 'bg-indigo-400 cursor-wait' 
                                            : 'bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800'
                                    } disabled:opacity-50 disabled:cursor-not-allowed`}
                                >
                                    {saving ? (
                                        <>
                                            <Loader2 className="w-5 h-5 mr-2 animate-spin" /> Salvando...
                                        </>
                                    ) : (
                                        isEditing ? 'Atualizar Registro' : 'Salvar Dia'
                                    )}
                                </button>
                                {isEditing && (
                                    <button
                                        onClick={() => { setInputs(initialInputs); setIsEditing(false); setCurrentRecordId(null); setAnalysisOutput(null); }}
                                        className="px-6 py-3 font-bold text-gray-700 bg-gray-200 rounded-xl hover:bg-gray-300 transition duration-150"
                                        disabled={saving}
                                    >
                                        Cancelar Edição
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Estatísticas Calculadas */}
                        <div className="mt-8">
                            <h2 className="text-2xl font-bold text-gray-700 mb-4">Métricas do Dia Atual</h2>
                            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                                <StatCard 
                                    title="Lucro Líquido" 
                                    value={stats.dailyProfit} 
                                    unit="R$" 
                                    icon={stats.dailyProfit >= 0 ? TrendingUp : TrendingDown} 
                                    color={stats.dailyProfit >= 0 ? 'text-green-600' : 'text-red-600'} 
                                />
                                <StatCard 
                                    title="Lucro Líq. / Hora" 
                                    value={stats.profitPerHour} 
                                    unit="R$" 
                                    icon={Clock} 
                                    color="text-indigo-600" 
                                />
                                <StatCard 
                                    title="Lucro Líq. / KM" 
                                    value={stats.profitPerKm} 
                                    unit="R$" 
                                    icon={Gauge} 
                                    color="text-teal-600" 
                                />
                                <StatCard 
                                    title="Custo Total" 
                                    value={stats.despesas} 
                                    unit="R$" 
                                    icon={TrendingDown} 
                                    color="text-red-600" 
                                />
                            </div>
                        </div>

                        {/* Dashboard Mensal e Análise de Custos */}
                        <MonthlyDashboard summary={monthlySummary} />

                        {/* Histórico */}
                        <HistoricalRecords 
                            records={records} 
                            handleEdit={handleEdit} 
                            handleDelete={handleDelete}
                            isEditing={isEditing}
                            deleteConfirmId={deleteConfirmId}
                            setDeleteConfirmId={setDeleteConfirmId}
                        />

                        {/* Footer de Status do Firebase */}
                        <footer className="mt-12 text-center text-xs text-gray-400 border-t pt-4">
                            <p>Status do Banco de Dados: {db ? 'Conectado (Firestore)' : 'Desconectado'}</p>
                            <p className="mt-1 flex items-center justify-center">
                                <User className="w-3 h-3 mr-1" color="text-gray-400" />
                                ID do Usuário (Firestore Path): {userId || 'Autenticando...'}
                            </p>
                            <p className="mt-1">© 2024 Controle de Corridas. Powered by Gemini & Firebase.</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);

    </script>
</body>
</html>
