<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Diário de Corridas</title>
    
    <!-- Carrega Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .whitespace-pre-line {
            white-space: pre-line;
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 antialiased font-sans">
    <div id="app" class="min-h-screen p-4 sm:p-8 font-sans">
        <div class="max-w-4xl mx-auto">
            <header class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-indigo-700 tracking-tight">
                    Controle Diário de Corridas
                </h1>
                <p class="text-gray-500 mt-2">
                    Insira os dados do dia para calcular o Lucro e Estatísticas.
                </p>
            </header>
            
            <div id="message-container"></div>
            <div id="input-form" class="bg-white p-6 rounded-xl shadow-2xl mb-8">
                <!-- O formulário será injetado aqui pelo JS -->
                <div class="flex justify-center items-center h-48 text-indigo-600">
                    <svg class="w-8 h-8 animate-spin mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                    Carregando aplicação...
                </div>
            </div>

            <div id="metrics-dashboard"></div>
            <div id="monthly-dashboard"></div>
            <div id="historical-records"></div>

            <footer id="footer-status" class="mt-12 text-center text-xs text-gray-400 border-t pt-4">
                <!-- Status do Firebase será injetado aqui -->
            </footer>
        </div>
    </div>

    <!-- MÓDULO JS PRINCIPAL -->
    <script type="module">
        // --- 1. CONFIGURAÇÃO DE IMPORTS ES MODULES (MAIS ESTÁVEL) ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            setDoc, 
            deleteDoc, 
            onSnapshot, 
            collection,
            query
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 2. VARIAVEIS GLOBAIS ---
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'daily_runs_tracker';
        const API_KEY = ""; // Será preenchida pelo ambiente de execução
        const GEMINI_API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent";
        
        let db;
        let auth;
        let userId = null;
        let records = [];
        let state = {
            inputs: {
                date: new Date().toISOString().substring(0, 10),
                saldo: '', aluguel: '', gasolina: '', refeicao: '', outros: '', 
                corridas: '', horas: '', km: '',
            },
            isEditing: false,
            currentRecordId: null,
            deleteConfirmId: null,
            saving: false,
            loading: true,
            error: null,
            analysisOutput: null,
            isAnalyzing: false,
            analysisForMonth: null,
        };

        // --- 3. UTILITÁRIOS E FUNÇÕES DE AJUDA ---

        const formatCurrency = (value) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(parseFloat(value) || 0);
        const formatNumber = (value) => (parseFloat(value) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const safeDiv = (numerator, denominator) => (denominator > 0 ? numerator / denominator : 0);

        const getStats = (inputs) => {
            const saldo = parseFloat(inputs.saldo) || 0;
            const aluguel = parseFloat(inputs.aluguel) || 0;
            const gasolina = parseFloat(inputs.gasolina) || 0;
            const refeicao = parseFloat(inputs.refeicao) || 0;
            const outros = parseFloat(inputs.outros) || 0;
            const despesas = aluguel + gasolina + refeicao + outros;

            const corridas = parseInt(inputs.corridas) || 0;
            const horas = parseFloat(inputs.horas) || 0;
            const km = parseFloat(inputs.km) || 0;

            const dailyProfit = saldo - despesas;

            return {
                dailyProfit, despesas, 
                aluguel, gasolina, refeicao, outros,
                grossPerTrip: safeDiv(saldo, corridas),
                grossPerHour: safeDiv(saldo, horas),
                grossPerKm: safeDiv(saldo, km),
                costPerTrip: safeDiv(despesas, corridas),
                costPerHour: safeDiv(despesas, horas),
                costPerKm: safeDiv(despesas, km),
                profitPerTrip: safeDiv(dailyProfit, corridas),
                profitPerHour: safeDiv(dailyProfit, horas),
                profitPerKm: safeDiv(dailyProfit, km),
            };
        };

        // --- 4. GESTÃO DE ESTADO E RENDERIZAÇÃO ---

        function setState(newState) {
            state = { ...state, ...newState };
            renderUI();
        }
        
        function updateInputs(name, value) {
            setState({ 
                inputs: { ...state.inputs, [name]: value },
                // Cancela o modo de edição se a data for alterada
                isEditing: name === 'date' ? false : state.isEditing,
            });
        }
        
        function setErrorMessage(message) {
            setState({ error: message });
            if (message) {
                setTimeout(() => setState({ error: null }), 6000);
            }
        }

        // --- 5. COMPONENTES SVG INLINE (Robustos) ---

        const getIconSVG = (iconName, color = 'text-gray-500', size = 24, className = 'w-5 h-5') => {
            let pathData = '';
            switch (iconName) {
                case 'Clock': pathData = '<circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline>'; break;
                case 'DollarSign': pathData = '<line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>'; break;
                case 'BarChart2': pathData = '<line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line>'; break;
                case 'TrendingUp': pathData = '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline>'; break;
                case 'TrendingDown': pathData = '<polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline>'; break;
                case 'Loader2': pathData = '<path d="M21 12a9 9 0 1 1-6.219-8.56"></path>'; break;
                case 'User': pathData = '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>'; break;
                case 'Gauge': pathData = '<path d="M12 19.5L5.5 12h13L12 19.5z"></path><path d="M12 4v8"></path><path d="M16.2 8.7L19.5 12"></path><path d="M7.8 8.7L4.5 12"></path>'; break;
                case 'Fuel': pathData = '<path d="M3 22h18"></path><path d="M4 22V10a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12"></path><path d="M18 6l-2-4"></path><path d="M8 12h8"></path>'; break;
                case 'Car': pathData = '<path d="M19 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z"></path><circle cx="7" cy="15" r="2"></circle><circle cx="17" cy="15" r="2"></circle><path d="M14 5H9"></path>'; break;
                case 'Coffee': pathData = '<path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M10 21V5a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v16h16a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H8"></path><path d="M16 8h1"></path>'; break;
                case 'Sparkles': pathData = '<path d="M14.5 4.5l2.4 3-2.4 3"></path><path d="M18 2h4v4"></path><path d="M14.5 20.5l-2.4-3 2.4-3"></path><path d="M18 22h4v-4"></path><path d="M8.5 4.5l-2.4-3 2.4-3"></path><path d="M2 2h4v4"></path><path d="M8.5 20.5l-2.4 3 2.4 3"></path><path d="M2 22h4v-4"></path>'; break;
                case 'Trash2': pathData = '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M15 6V4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v2"></path>'; break;
                default: return '';
            }
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className} ${color}">${pathData}</svg>`;
        };

        // --- 6. FUNÇÕES DE RENDERIZAÇÃO DA UI ---

        function renderInputForm() {
            const container = document.getElementById('input-form');
            if (!container) return;

            const inputs = state.inputs;
            const stats = getStats(inputs);
            const isEditing = state.isEditing;

            const inputField = (label, name, type, iconName, placeholder = '', required = false, isCurrency = false) => {
                const value = inputs[name];
                const Icon = iconName ? getIconSVG(iconName, 'text-gray-400', 16, 'w-4 h-4') : '';
                const plClass = Icon ? 'pl-9' : 'pl-3';
                
                return `
                    <div class="relative">
                        <label for="${name}" class="block text-sm font-medium text-gray-700">
                            ${label} ${required ? '<span class="text-red-500">*</span>' : ''}
                        </label>
                        <div class="relative">
                            ${Icon ? `<div class="absolute left-3 top-1/2 transform -translate-y-1/2">${Icon}</div>` : ''}
                            <input
                                id="${name}"
                                name="${name}"
                                type="${type}"
                                value="${value}"
                                oninput="document.updateInputValue('${name}', this.value)"
                                step="${type === 'number' ? (isCurrency ? '0.01' : '0.1') : '1'}"
                                placeholder="${placeholder}"
                                required="${required}"
                                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-3 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition duration-150 bg-white ${plClass}"
                            />
                        </div>
                    </div>
                `;
            };
            
            // Expor a função de atualização de input para o oninput
            window.updateInputValue = (name, value) => updateInputs(name, value);

            container.innerHTML = `
                <h2 class="text-xl font-bold text-gray-800 mb-4">
                    ${isEditing ? `Editando Registro de ${new Date(inputs.date).toLocaleDateString('pt-BR')}` : 'Novo Registro Diário'}
                </h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="col-span-2 md:col-span-1">
                        ${inputField('Data', 'date', 'date', null, '', true)}
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        ${inputField('Saldo Bruto (R$)', 'saldo', 'number', 'DollarSign', 'Ex: 550.00', true, true)}
                    </div>
                    ${inputField('Nº Corridas', 'corridas', 'number', 'Car', 'Ex: 35', true)}
                    ${inputField('Horas Online', 'horas', 'number', 'Clock', 'Ex: 10.5', true)}
                    <div class="col-span-2 md:col-span-4">
                        ${inputField('KM Total Rodado', 'km', 'number', 'Gauge', 'Ex: 280.4', true)}
                    </div>
                </div>

                <h3 class="text-md font-semibold text-gray-700 border-t pt-4 mt-4 mb-3">Despesas (R$)</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    ${inputField('Aluguel/Financ.', 'aluguel', 'number', 'Car', '0.00', false, true)}
                    ${inputField('Gasolina/Etanol', 'gasolina', 'number', 'Fuel', '0.00', false, true)}
                    ${inputField('Refeição', 'refeicao', 'number', 'Coffee', '0.00', false, true)}
                    ${inputField('Outros (Limpeza, etc)', 'outros', 'number', 'DollarSign', '0.00', false, true)}
                </div>

                <div class="mt-6 flex justify-end space-x-3">
                    <button
                        id="save-button"
                        onclick="window.saveRecord()"
                        ${state.saving || state.loading || !userId ? 'disabled' : ''}
                        class="flex items-center justify-center px-6 py-3 font-bold text-white rounded-xl shadow-lg transition duration-150 
                        ${state.saving ? 'bg-indigo-400 cursor-wait' : 'bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800'} 
                        disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        ${state.saving 
                            ? `${getIconSVG('Loader2', 'text-white', 20, 'w-5 h-5 mr-2 animate-spin')} Salvando...` 
                            : isEditing ? 'Atualizar Registro' : 'Salvar Dia'
                        }
                    </button>
                    ${isEditing ? `
                        <button
                            onclick="window.cancelEdit()"
                            class="px-6 py-3 font-bold text-gray-700 bg-gray-200 rounded-xl hover:bg-gray-300 transition duration-150"
                            ${state.saving ? 'disabled' : ''}
                        >
                            Cancelar Edição
                        </button>
                    ` : ''}
                </div>
            `;
            
            // Adiciona validação simples ao botão
            const saveButton = document.getElementById('save-button');
            if (saveButton) {
                const requiredFields = ['date', 'saldo', 'corridas', 'horas', 'km'];
                const validate = () => {
                    const isValid = requiredFields.every(field => (state.inputs[field] !== '' && parseFloat(state.inputs[field]) >= 0));
                    saveButton.disabled = state.saving || state.loading || !userId || !isValid;
                };
                validate(); 
                // Adiciona listener para garantir que a validação seja executada em tempo real
                container.addEventListener('input', validate);
            }
        }
        
        function renderMetricsDashboard() {
            const container = document.getElementById('metrics-dashboard');
            if (!container) return;

            const stats = getStats(state.inputs);

            const statCard = (title, value, unit, iconName, color) => {
                const Icon = getIconSVG(iconName, color, 20);
                const valueClass = value >= 0 ? 'text-green-700' : 'text-red-700';

                return `
                    <div class="bg-white p-4 shadow-lg rounded-xl flex flex-col justify-between hover:shadow-xl border border-gray-100">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-semibold text-gray-500 truncate">${title}</h3>
                            ${Icon}
                        </div>
                        <p class="mt-1 text-2xl font-bold ${color === 'text-red-600' && value < 0 ? 'text-red-600' : (color === 'text-red-600' ? 'text-gray-900' : valueClass)}">
                            ${formatNumber(value)}
                            ${unit ? `<span class="text-base font-medium text-gray-500 ml-1">${unit}</span>` : ''}
                        </p>
                    </div>
                `;
            };

            container.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-700 mb-4">Métricas do Dia Atual</h2>
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    ${statCard("Lucro Líquido", stats.dailyProfit, "R$", stats.dailyProfit >= 0 ? 'TrendingUp' : 'TrendingDown', stats.dailyProfit >= 0 ? 'text-green-600' : 'text-red-600')}
                    ${statCard("Lucro Líq. / Hora", stats.profitPerHour, "R$", 'Clock', 'text-indigo-600')}
                    ${statCard("Lucro Líq. / KM", stats.profitPerKm, "R$", 'Gauge', 'text-teal-600')}
                    ${statCard("Custo Total", stats.despesas, "R$", 'TrendingDown', 'text-red-600')}
                </div>
            `;
        }
        
        function renderMonthlyDashboard() {
            const container = document.getElementById('monthly-dashboard');
            if (!container) return;
            
            const summary = getMonthlySummary();
            if (summary.length === 0) {
                container.innerHTML = '';
                return;
            }

            const getMonthName = (monthYear) => {
                const date = new Date(`${monthYear}-01T12:00:00Z`);
                return date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            }

            container.innerHTML = `
                <div class="mt-8 bg-indigo-50 p-6 rounded-xl shadow-inner mb-8">
                    <h2 class="text-2xl font-bold mb-4 text-indigo-700 flex items-center">
                        ${getIconSVG('BarChart2', 'text-indigo-700', 20, 'w-5 h-5 mr-2')} Resumo Mensal
                    </h2>
                    <div class="space-y-6">
                        ${summary.map(month => {
                            const monthName = getMonthName(month.monthYear);
                            const isCurrentAnalysis = state.analysisForMonth === month.monthYear;
                            const analysisContent = isCurrentAnalysis && state.analysisOutput 
                                ? `<div class="mt-4 p-4 bg-purple-50 border border-purple-300 rounded-lg whitespace-pre-line text-sm text-gray-800">
                                        <p class="font-bold text-purple-700 mb-2">Relatório do Consultor Gemini para ${monthName}:</p>
                                        ${state.analysisOutput}
                                    </div>`
                                : '';

                            return `
                                <div class="p-4 bg-white rounded-lg shadow-md border-l-4 border-indigo-500">
                                    <h3 class="text-xl font-extrabold text-indigo-600 mb-2 capitalize">${monthName}</h3>
                                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                                        <div class="p-2 bg-green-50 rounded-md">
                                            <p class="text-xs text-gray-500">Lucro Total</p>
                                            <p class="font-bold text-green-700">${formatCurrency(month.totalProfit)}</p>
                                        </div>
                                        <div class="p-2 bg-red-50 rounded-md">
                                            <p class="text-xs text-gray-500">Custo Total</p>
                                            <p class="font-bold text-red-700">${formatCurrency(month.totalDespesas)}</p>
                                        </div>
                                        <div class="p-2 bg-yellow-50 rounded-md">
                                            <p class="text-xs text-gray-500">KM Total</p>
                                            <p class="font-bold text-yellow-700">${formatNumber(month.totalKm)} km</p>
                                        </div>
                                        <div class="p-2 bg-blue-50 rounded-md">
                                            <p class="text-xs text-gray-500">Viagens Total</p>
                                            <p class="font-bold text-blue-700">${month.totalTrips}</p>
                                        </div>
                                    </div>
                                    <div class="mt-3 pt-3 border-t border-gray-100 grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
                                        <p class="text-gray-600">Lucro Líq./KM: <span class="font-bold text-teal-700">${formatCurrency(month.profitPerKm)}</span></p>
                                        <p class="text-gray-600">Lucro Líq./Hora: <span class="font-bold text-teal-700">${formatCurrency(month.profitPerHour)}</span></p>
                                        <p class="text-gray-600">Custo Médio/Viagem: <span class="font-bold text-red-700">${formatCurrency(month.costPerTrip)}</span></p>
                                    </div>
                                    
                                    <div class="mt-4 flex justify-end">
                                        <button
                                            onclick="window.handleAnalyzeCosts('${month.monthYear}')"
                                            ${state.isAnalyzing ? 'disabled' : ''}
                                            class="flex items-center justify-center px-4 py-2 font-semibold text-white rounded-lg shadow-md transition duration-150 text-sm 
                                            ${state.isAnalyzing && isCurrentAnalysis
                                                ? 'bg-purple-400 cursor-wait'
                                                : 'bg-purple-600 hover:bg-purple-700 active:bg-purple-800'
                                            }"
                                        >
                                            ${state.isAnalyzing && isCurrentAnalysis ? (
                                                `${getIconSVG('Loader2', 'text-white', 16, 'w-4 h-4 mr-2 animate-spin')} Analisando...`
                                            ) : (
                                                `${getIconSVG('Sparkles', 'text-white', 16, 'w-4 h-4 mr-2')} Análise de Custos ✨`
                                            )}
                                        </button>
                                    </div>
                                    ${analysisContent}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function getMonthlySummary() {
            if (records.length === 0) return [];
                
            const summary = records.reduce((acc, record) => {
                const monthYear = record.date.substring(0, 7); 
                
                if (!acc[monthYear]) {
                    acc[monthYear] = {
                        monthYear,
                        totalProfit: 0, totalKm: 0, totalTrips: 0, totalHours: 0, totalDespesas: 0,
                        aluguel: 0, gasolina: 0, refeicao: 0, outros: 0, 
                        count: 0,
                    };
                }
                
                acc[monthYear].totalProfit += parseFloat(record.dailyProfit) || 0;
                acc[monthYear].totalKm += parseFloat(record.km) || 0;
                acc[monthYear].totalTrips += parseInt(record.corridas) || 0;
                acc[monthYear].totalHours += parseFloat(record.horas) || 0;
                acc[monthYear].totalDespesas += parseFloat(record.despesas) || 0;
                
                acc[monthYear].aluguel += parseFloat(record.aluguel) || 0;
                acc[monthYear].gasolina += parseFloat(record.gasolina) || 0;
                acc[monthYear].refeicao += parseFloat(record.refeicao) || 0;
                acc[monthYear].outros += parseFloat(record.outros) || 0;

                acc[monthYear].count += 1;
                
                return acc;
            }, {});

            return Object.values(summary).map(monthData => ({
                ...monthData,
                profitPerKm: safeDiv(monthData.totalProfit, monthData.totalKm),
                profitPerHour: safeDiv(monthData.totalProfit, monthData.totalHours),
                costPerTrip: safeDiv(monthData.totalDespesas, monthData.totalTrips),
                avgAluguel: safeDiv(monthData.aluguel, monthData.count),
                avgGasolina: safeDiv(monthData.gasolina, monthData.count),
                avgRefeicao: safeDiv(monthData.refeicao, monthData.count),
                avgOutros: safeDiv(monthData.outros, monthData.count),
            })).sort((a, b) => b.monthYear.localeCompare(a.monthYear)); 
        }

        function renderHistoricalRecords() {
            const container = document.getElementById('historical-records');
            if (!container) return;

            const content = `
                <div class="mt-8 bg-white p-6 rounded-xl shadow-lg">
                    <h2 class="text-2xl font-bold mb-4 text-gray-700 flex items-center">
                        ${getIconSVG('Clock', 'text-gray-600', 20, 'w-5 h-5 mr-2')} Histórico Diário (${records.length})
                    </h2>
                    <div class="space-y-3 max-h-96 overflow-y-auto pr-2">
                        ${state.loading ? `<p class="text-center text-indigo-500 py-4 flex justify-center items-center">${getIconSVG('Loader2', 'text-indigo-500', 20, 'w-5 h-5 mr-2 animate-spin')} Carregando histórico...</p>` : ''}
                        
                        ${!state.loading && records.length === 0 ? `<p class="text-center text-gray-500 py-4">Nenhum registro encontrado. Salve seu primeiro dia!</p>` : ''}
                        
                        ${records.map(r => {
                            const isEditing = state.currentRecordId === r.id;
                            const isConfirmingDelete = state.deleteConfirmId === r.id;
                            
                            const deleteBlock = isConfirmingDelete ? `
                                <div class="mt-3 p-2 bg-red-100 rounded-md flex justify-between items-center">
                                    <span class="text-sm text-red-800 font-semibold">Confirmar exclusão?</span>
                                    <div>
                                        <button 
                                            onclick="window.handleDelete('${r.id}')"
                                            class="text-white bg-red-600 hover:bg-red-700 text-xs py-1 px-2 rounded-lg mr-2 transition"
                                        >
                                            Sim, Excluir
                                        </button>
                                        <button 
                                            onclick="window.setState({ deleteConfirmId: null })" 
                                            class="text-red-600 bg-white hover:bg-gray-200 text-xs py-1 px-2 rounded-lg transition border border-gray-300"
                                        >
                                            Cancelar
                                        </button>
                                    </div>
                                </div>
                            ` : `
                                <div class="mt-3 flex space-x-2 border-t pt-2 border-gray-200">
                                    <button 
                                        onclick="window.handleEdit('${r.id}')" 
                                        ${state.isEditing ? 'disabled' : ''}
                                        class="text-indigo-600 hover:text-indigo-800 bg-indigo-100 text-xs py-1 px-3 rounded-full font-medium transition ${state.isEditing ? 'opacity-50 cursor-not-allowed' : ''}"
                                    >
                                        Editar
                                    </button>
                                    <button 
                                        onclick="window.setState({ deleteConfirmId: '${r.id}' })" 
                                        ${state.isEditing ? 'disabled' : ''}
                                        class="text-red-600 hover:text-red-800 bg-red-100 text-xs py-1 px-3 rounded-full font-medium transition ${state.isEditing ? 'opacity-50 cursor-not-allowed' : ''}"
                                    >
                                        Excluir
                                    </button>
                                </div>
                            `;

                            return `
                                <div key="${r.id}" class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                                    <p class="font-bold text-lg text-indigo-600 mb-2">
                                        ${new Date(r.date).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short', year: 'numeric' })}
                                        ${isEditing ? '<span class="text-xs bg-yellow-200 text-yellow-800 px-2 py-0.5 ml-2 rounded-full font-medium">EDITANDO</span>' : ''}
                                    </p>
                                    <div class="grid grid-cols-2 text-sm mt-1 gap-1">
                                        <span class="text-gray-600">Lucro Líquido:</span>
                                        <span class="font-semibold ${r.dailyProfit >= 0 ? 'text-green-700' : 'text-red-700'}">${formatCurrency(r.dailyProfit)}</span>
                                        <span class="text-gray-600">Lucro/Hora:</span>
                                        <span class="font-semibold text-teal-700">${formatCurrency(r.profitPerHour)}</span>
                                        <span class="text-gray-600">KM / Corridas:</span>
                                        <span class="font-semibold text-gray-800">${r.km} km / ${r.corridas} viagens</span>
                                    </div>
                                    ${deleteBlock}
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            container.innerHTML = content;
        }

        function renderFooter() {
            const container = document.getElementById('footer-status');
            const userIcon = getIconSVG('User', 'text-gray-400', 12, 'w-3 h-3 mr-1');
            container.innerHTML = `
                <p>Status do Banco de Dados: ${db ? 'Conectado (Firestore)' : 'Desconectado'}</p>
                <p class="mt-1 flex items-center justify-center">
                    ${userIcon} ID do Usuário (Firestore Path): ${userId || 'Autenticando...'}
                </p>
                <p class="mt-1">© 2024 Controle de Corridas. Powered by Gemini & Firebase.</p>
            `;
        }
        
        function renderMessages() {
            const container = document.getElementById('message-container');
            if (state.error) {
                container.innerHTML = `
                    <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm font-medium" role="alert">
                        <strong>Erro:</strong> ${state.error}
                    </div>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        function renderUI() {
            renderMessages();
            renderInputForm();
            renderMetricsDashboard();
            renderMonthlyDashboard();
            renderHistoricalRecords();
            renderFooter();
        }

        // --- 7. FUNÇÕES DE DADOS E FIREBASE ---

        async function initFirebase() {
            if (Object.keys(firebaseConfig).length === 0) {
                console.error("Firebase Config não encontrado. Usando ID de usuário de mock.");
                userId = crypto.randomUUID();
                setState({ loading: false });
                return;
            }

            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                if (token) {
                    await signInWithCustomToken(auth, token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        startDataListener(); 
                    } else {
                        // Isso é um fallback, a authWithCustomToken deve funcionar
                        userId = crypto.randomUUID(); 
                        setState({ loading: false });
                    }
                });
            } catch (e) {
                console.error("Erro fatal ao inicializar Firebase:", e);
                setErrorMessage("Erro ao conectar com o banco de dados.");
                userId = crypto.randomUUID(); 
                setState({ loading: false });
            }
        }

        function startDataListener() {
            if (!db || !userId) return;

            const collectionPath = `artifacts/${appId}/users/${userId}/daily_runs`;
            const q = collection(db, collectionPath);
            
            onSnapshot(q, (snapshot) => {
                records = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                })).sort((a, b) => new Date(b.date) - new Date(a.date)); 
                
                setState({ loading: false });
            }, (err) => {
                console.error("Erro ao carregar registros:", err);
                setErrorMessage("Falha ao sincronizar dados em tempo real.");
                setState({ loading: false });
            });
        }

        window.saveRecord = async () => {
            if (!db || !userId || state.saving) return;

            const { date, saldo, corridas, horas, km } = state.inputs;
            
            if (!date || !saldo || !corridas || !horas || !km || parseFloat(saldo) < 0 || parseInt(corridas) < 0 || parseFloat(horas) < 0 || parseFloat(km) < 0) {
                setErrorMessage("Por favor, preencha Data, Saldo, Nº Corridas, Horas e KM com valores válidos e positivos.");
                return;
            }

            setState({ saving: true, error: null });

            const stats = getStats(state.inputs);
            
            const recordData = {
                date,
                saldo: parseFloat(saldo),
                despesas: stats.despesas, 
                corridas: parseInt(corridas),
                horas: parseFloat(horas),
                km: parseFloat(km),
                ...stats,
                // Armazenar despesas individuais para análise
                aluguel: parseFloat(state.inputs.aluguel) || 0,
                gasolina: parseFloat(state.inputs.gasolina) || 0,
                refeicao: parseFloat(state.inputs.refeicao) || 0,
                outros: parseFloat(state.inputs.outros) || 0,
                
                createdAt: new Date().toISOString(),
                userId,
            };

            try {
                // Usa a data como ID do documento para garantir unicidade e facilidade de busca
                const docId = date; 
                const docRef = doc(db, `artifacts/${appId}/users/${userId}/daily_runs`, docId);
                await setDoc(docRef, recordData);
                
                setState({
                    inputs: {
                        date: new Date().toISOString().substring(0, 10),
                        saldo: '', aluguel: '', gasolina: '', refeicao: '', outros: '', 
                        corridas: '', horas: '', km: '',
                    },
                    currentRecordId: null,
                    isEditing: false,
                    analysisOutput: null,
                    analysisForMonth: null,
                });
                setErrorMessage("Registro salvo/atualizado com sucesso!");

            } catch (e) {
                console.error("Erro ao salvar:", e);
                setErrorMessage(`Erro ao salvar o registro. Detalhe: ${e.message}`);
            } finally {
                setState({ saving: false });
            }
        };

        window.handleDelete = async (recordId) => {
            if (!db || !userId) return;
            
            setState({ deleteConfirmId: null, error: null });

            try {
                const docRef = doc(db, `artifacts/${appId}/users/${userId}/daily_runs`, recordId);
                await deleteDoc(docRef);
                setErrorMessage("Registro excluído com sucesso.");
            } catch (e) {
                console.error("Erro ao deletar:", e);
                setErrorMessage("Erro ao excluir o registro. Tente novamente.");
            }
        };

        window.handleEdit = (recordId) => {
            const record = records.find(r => r.id === recordId);
            if (!record) return;

            setState({
                inputs: {
                    date: record.date,
                    saldo: String(record.saldo || ''),
                    aluguel: String(record.aluguel || ''),
                    gasolina: String(record.gasolina || ''),
                    refeicao: String(record.refeicao || ''),
                    outros: String(record.outros || ''),
                    corridas: String(record.corridas || ''),
                    horas: String(record.horas || ''),
                    km: String(record.km || ''),
                },
                currentRecordId: recordId,
                isEditing: true,
                error: null,
                analysisOutput: null,
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        
        window.cancelEdit = () => {
            setState({
                inputs: {
                    date: new Date().toISOString().substring(0, 10),
                    saldo: '', aluguel: '', gasolina: '', refeicao: '', outros: '', 
                    corridas: '', horas: '', km: '',
                },
                currentRecordId: null,
                isEditing: false,
                analysisOutput: null,
            });
        }
        
        window.handleAnalyzeCosts = async (monthYear) => {
            if (state.isAnalyzing) return;
            
            const monthData = getMonthlySummary().find(m => m.monthYear === monthYear);
            if (!monthData) return;
            
            setState({ isAnalyzing: true, analysisOutput: null, analysisForMonth: monthYear, error: null });

            const systemPrompt = "Você é um consultor financeiro especialista em otimização de custos para motoristas de aplicativo. Forneça uma análise concisa (3 a 4 parágrafos) focada em identificar áreas de alto custo e ofereça 3 dicas práticas e acionáveis para otimizar os lucros sem comprometer o desempenho. Mantenha um tom profissional e direto.";

            const userQuery = `Analise meus dados financeiros agregados para o mês de ${monthData.monthYear}, com foco em custos.

Dados do Mês:
- Lucro Total: R$${formatNumber(monthData.totalProfit)}
- Despesas Totais: R$${formatNumber(monthData.totalDespesas)}
- Quilometragem Total: ${formatNumber(monthData.totalKm)} km
- Viagens Totais: ${monthData.totalTrips} viagens
- Horas Trabalhadas: ${formatNumber(monthData.totalHours)} horas

Custos Médios Diários Detalhados (Baseado em ${monthData.count} dias de registro):
- Custo Médio Diário Aluguel/Financ. (Fixos): R$${formatNumber(monthData.avgAluguel)}
- Custo Médio Diário Gasolina/Combustível (Variáveis): R$${formatNumber(monthData.avgGasolina)}
- Custo Médio Diário Refeição: R$${formatNumber(monthData.avgRefeicao)}
- Custo Médio Diário Outros: R$${formatNumber(monthData.avgOutros)}
`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
            };

            const maxRetries = 3;

            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(`${GEMINI_API_URL}?key=${API_KEY}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) {
                            setState({ analysisOutput: text, isAnalyzing: false });
                            return; 
                        }
                    }
                    
                    if (attempt < maxRetries - 1) {
                        await new Promise(resolve => setTimeout(resolve, Math.pow(2, attempt) * 1000));
                    } else {
                        throw new Error("Falha na geração após múltiplas tentativas.");
                    }
                } catch (e) {
                    if (attempt === maxRetries - 1) {
                        setErrorMessage(`Erro ao gerar análise. Ocorreu um problema de rede ou no servidor.`);
                    }
                }
            }
            
            setState({ isAnalyzing: false, analysisOutput: "Não foi possível gerar a análise. Tente novamente mais tarde." });
        };


        // --- 8. INICIALIZAÇÃO ---
        window.onload = initFirebase;
        
        // Expor o setState para ser acessível pelos manipuladores de eventos onClick
        window.setState = setState; 
        
    </script>
</body>
</html>
